# The WASM tool-sandbox runtime: a containerd shim on every node, and the
# RuntimeClass that selects it.
#
# Why a DaemonSet and not a documented `docker exec`: the shim has to be
# installed on the NODE, and the only portable way to reach a node is a
# privileged pod. That is also why this is the one part of Kaimahi that runs
# privileged — it writes a binary into /opt/kwasm/bin and edits containerd's
# config, which is exactly what installing a runtime means. It is scoped to
# its own namespace, and nothing else in the repo asks for these rights.
#
# Kaimahi builds no shim: containerd-shim-spin is upstream's, pinned by tag,
# and the installer image is upstream's too.
apiVersion: v1
kind: Namespace
metadata:
  name: kaimahi-wasm
  labels:
    kaimahi.dev/component: tool-sandbox
---
# The class an MCP server asks for. `handler: spin` is the runtime name the
# installer registers with containerd; the two must agree or pods stay
# Pending with no obvious cause.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: wasmtime-spin-v2
handler: spin
# The installer only ever runs on Linux nodes, so only Linux nodes have the
# shim. Without this, a pod naming this class can still be scheduled onto a
# Windows node, where the `spin` handler does not exist — and it fails at the
# runtime, late and obscurely, rather than being steered away by the
# scheduler. The admission merge intersects this with the pod's own
# nodeSelector, so a pod cannot widen it.
scheduling:
  nodeSelector:
    kubernetes.io/os: linux
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spin-node-installer
  namespace: kaimahi-wasm
spec:
  selector:
    matchLabels:
      app: spin-node-installer
  template:
    metadata:
      labels:
        app: spin-node-installer
    spec:
      hostPID: true
      # Linux nodes only: the shim is a Linux binary, and a Windows node
      # would fail obscurely rather than be skipped.
      nodeSelector:
        kubernetes.io/os: linux
      # Reach control-plane nodes too — on a single-node kind cluster that
      # IS the only node, so without this the installer schedules nowhere.
      tolerations:
        - operator: Exists
      containers:
        - name: installer
          # Pinned by DIGEST, not by tag. A GHCR tag is mutable, and this
          # container runs privileged, with hostPID, and with the node's root
          # filesystem mounted at /mnt/node-root — so whoever controls the tag
          # controls every node in the cluster. The digest is v0.20.0 as
          # resolved from ghcr.io; the tag is kept alongside it for humans.
          # v0.20.0
          image: ghcr.io/spinframework/containerd-shim-spin/node-installer@sha256:a0e341594420a444189f92b15b11e99436cc3de517e6fac1a52a7635057a1391
          # The installer does its work and EXITS 0. A DaemonSet expects a
          # long-running process, so left alone it CrashLoopBackOffs after
          # succeeding — the shim is installed and the DaemonSet still reports
          # 0 ready, which reads as broken and makes `rollout status` a lie.
          # Holding the container open after a successful install makes Ready
          # mean "this node has the shim", which is what a caller needs to
          # wait on. A FAILED install still exits non-zero and still crashes,
          # so failure stays visible.
          command: ["/bin/sh", "-c", "/script/installer.sh && touch /tmp/.kaimahi-installed && sleep infinity"]
          # Readiness is gated on a marker the installer writes ONLY after it
          # exits 0. Without this the container is Ready the instant it
          # starts — so `rollout status` returns while installer.sh is still
          # writing the shim and restarting containerd, and a workload
          # scheduled immediately afterwards can land on a node whose `spin`
          # handler does not exist yet. The marker is what makes "Ready"
          # mean "this node has the shim" rather than "this node has a pod".
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -f /tmp/.kaimahi-installed"]
            periodSeconds: 2
            # 2s x 150 = the 300s that `rollout status` is given, so the
            # probe and the caller time out together instead of one hiding
            # the other's failure.
            failureThreshold: 150
          securityContext:
            privileged: true
          # The installer writes into the node filesystem through this
          # mount; it reads the path from NODE_ROOT and exits non-zero
          # without it (line 24 of its own installer.sh).
          env:
            - name: NODE_ROOT
              value: /mnt/node-root
          volumeMounts:
            - name: host-root
              mountPath: /mnt/node-root
      volumes:
        - name: host-root
          hostPath:
            path: /
