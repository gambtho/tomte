# P13: the demo's ERP — an MCP tool server over a fixture corpus, in the
# plane's namespace, reachable only through the enforcing MCP gateway.
#
# WHY THIS IS NOT AN MCPServer LIKE k8s/slack-mcp.yaml. That one deploys a
# published third-party image through kagent's CRD, digest-pinned. This
# image is OURS and is deliberately never published (P13 guardrail), so it
# is built from source and side-loaded into kind by `make erp`
# (scripts/erp-deploy.sh) and runs as a plain Deployment. The POSTURE is
# the same one and that is what matters: it holds no credential, it dials
# nothing, and its NetworkPolicy admits the proxy and no one else
# (k8s/plane/network-policy.yaml, rule 5).
#
# THE CORPUS IS NOT IN THIS FILE AND NOT IN THE IMAGE. It is
# k8s/erp-fixtures.json, projected as the ConfigMap kaimahi-erp-fixtures
# by `make erp-fixtures`, which also restarts this Deployment. Editing the
# story is editing that JSON — no rebuild (D30). One source of truth, so
# the corpus the Go tests check the arithmetic of
# (internal/erp/fixtures_test.go) is the corpus that runs. The mount is
# required, not optional: a pod with no corpus does not start, rather than
# serving an empty ERP that looks like an answer.
#
# It is a SYSTEM OF RECORD, NOT A CONTROL. payment_schedule accepts any
# payee it is given, exactly as a real ERP's payment API would. Everything
# that stops the wrong payment is in front of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaimahi-erp
  namespace: kaimahi
  labels:
    app: kaimahi-erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaimahi-erp
  template:
    metadata:
      labels:
        app: kaimahi-erp
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: erp
          image: kaimahi-erp:dev
          # kind only: the image is side-loaded, never pulled. A registry
          # target would need a pushed image and a pull policy to match;
          # the demo runs on kind (P13 guardrail).
          imagePullPolicy: Never
          args: ["-addr", ":8085", "-fixtures", "/etc/kaimahi/erp/fixtures.json"]
          ports:
            - name: mcp
              containerPort: 8085
          volumeMounts:
            - name: fixtures
              mountPath: /etc/kaimahi/erp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      volumes:
        - name: fixtures
          configMap:
            name: kaimahi-erp-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-erp-mcp
  namespace: kaimahi
  labels:
    app: kaimahi-erp
spec:
  selector:
    app: kaimahi-erp
  ports:
    - name: mcp
      port: 8085
      targetPort: mcp
