# The Kaimahi proxy: kagent's governed ModelConfigs point their
# openAI.baseUrl at THIS Service. Real upstream credentials exist only as
# Secrets mounted into this pod; agents carry Kaimahi-issued opaque
# tokens. The admin port (9091) is deliberately NOT exposed by the
# Service — reaching it takes kubectl port-forward to the pod, i.e.
# cluster credentials, and then the admin bearer token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaimahi-proxy
  namespace: kaimahi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaimahi-proxy
  template:
    metadata:
      labels:
        app: kaimahi-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          # Built from plane/Dockerfile and side-loaded into kind by
          # `make plane-image` (never pulled). The tag moves with the
          # phase so a stale side-loaded image can never satisfy a newer
          # manifest silently (imagePullPolicy: Never reuses same-tag
          # images without complaint).
          #
          # `Never` is deliberate and stays the committed default: a
          # side-loaded LOCAL tag must never quietly fall back to PULLING
          # a squattable public name (P4a/P4b rulings). It is also what
          # makes this file unusable as-is off kind — so P5b makes the
          # image reference and the pull policy environment-dependent
          # rather than editing them here: for a registry-backed cluster
          # (AKS, private ACR) scripts/plane-deploy.sh renders both from
          # PLANE_IMAGE / PLANE_PULL_POLICY at deploy time, and the kind
          # path applies this document exactly as committed.
          image: kaimahi-proxy:p7b
          imagePullPolicy: Never
          env:
            - name: PGHOST
              value: kaimahi-postgres
            - name: PGDATABASE
              value: kaimahi
            - name: PGUSER
              value: kaimahi
            # Secrets arrive as mounted files only (PGPASSWORD_FILE,
            # ADMIN_TOKEN_FILE defaults) — no secret-valued env vars.
          ports:
            - name: data
              containerPort: 8080
            - name: mcp
              containerPort: 8081
            - name: inbound
              containerPort: 8082
            - name: admin
              containerPort: 9091
          volumeMounts:
            - name: upstreams
              mountPath: /etc/kaimahi/upstreams.json
              subPath: upstreams.json
              readOnly: true
            - name: pg-secret
              mountPath: /etc/kaimahi/pg
              readOnly: true
            - name: admin-secret
              mountPath: /etc/kaimahi/admin
              readOnly: true
            - name: copilot-cred
              mountPath: /etc/kaimahi/upstream-creds/copilot
              readOnly: true
            - name: slack-mcp-cred
              mountPath: /etc/kaimahi/upstream-creds/slack
              readOnly: true
            - name: inbound-signing
              mountPath: /etc/kaimahi/inbound
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: data
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: upstreams
          configMap:
            name: kaimahi-upstreams
        - name: pg-secret
          secret:
            secretName: kaimahi-pg
        - name: admin-secret
          secret:
            secretName: kaimahi-admin
            items:
              - key: token
                path: token
        - name: copilot-cred
          secret:
            secretName: kaimahi-copilot-token
            # The Copilot upstream is optional: without this Secret the
            # governed ollama path still works and copilot requests fail
            # closed (503 upstream credential unavailable).
            optional: true
        # P5a: the Slack MCP server's OWN bearer credential — the gateway
        # injects it upstream (plane custody, like the Copilot key). This
        # pod deliberately does NOT mount kaimahi-slack-bot: the Slack
        # workspace token belongs to the MCP server pod alone.
        - name: slack-mcp-cred
          secret:
            secretName: kaimahi-slack-mcp-key
            # Optional, same contract: with no Secret the slack upstream
            # fails closed (503) and every other path is unaffected.
            optional: true
        # P7b: signing secrets for HMAC-authenticated inbound hooks, one
        # key per hook name (scripts/inbound-secret.sh). Plane custody
        # only — the caller holds its own copy, nothing agent-side does.
        # Optional: a signed hook whose secret is absent fails closed
        # (503 "hook signing secret unavailable"); bearer hooks and every
        # other listener are unaffected.
        - name: inbound-signing
          secret:
            secretName: kaimahi-inbound-signing
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-proxy
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-proxy
  ports:
    - name: data
      port: 8080
      targetPort: data
---
# The P4b MCP gateway's own address: the URL the Kaimahi-owned
# RemoteMCPServer (k8s/kaimahi-tools.yaml) points kagent at. Same pod as
# the proxy (the gateway is a second data listener in the kaimahi-proxy
# process — zero extra CPU requests on the full CI node); a separate
# Service keeps the tool seam addressable on its own name, and neither
# Service exposes the admin port.
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-mcp-gateway
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-proxy
  ports:
    - name: mcp
      port: 8081
      targetPort: mcp
---
# The P7b inbound bridge's own address: where external events are
# delivered. Same pod (a fourth listener in the kaimahi-proxy process —
# zero extra CPU requests), its own Service so the ingress seam is
# addressable on its own name and can be exposed on its own terms. It is
# a ClusterIP: on kind the demo reaches it via port-forward; exposing it
# beyond the cluster (an Ingress/LoadBalancer with TLS) is the operator's
# step and is documented, not committed. The admin port stays off it.
apiVersion: v1
kind: Service
metadata:
  name: kaimahi-inbound
  namespace: kaimahi
spec:
  selector:
    app: kaimahi-proxy
  ports:
    - name: inbound
      port: 8082
      targetPort: inbound
