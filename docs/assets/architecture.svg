<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc">
  <title id="title">Kaimahi governance architecture</title>
  <desc id="desc">A Kubernetes-hosted agent sends governed model calls through the Kaimahi LLM proxy and governed tool calls through its MCP gateway. Bounded approvals can temporarily grant either path. Dashed paths show that a plain model preset and direct MCP wiring are ungoverned.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#24D6D9"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#FFB547"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .group-label { font-size: 22px; font-weight: 700; fill: #F7F4E8; }
      .node-title { font-size: 24px; font-weight: 700; fill: #071521; }
      .node-detail { font-size: 20px; fill: #071521; }
      .agent-label { font-size: 22px; font-weight: 700; fill: #071521; }
      .edge-label { font-size: 20px; font-weight: 700; fill: #F7F4E8; }
      .approval-label, .bypass-label { font-size: 20px; font-weight: 700; fill: #FFF1B3; }
      .node { stroke-width: 3; }
      .governed-in { fill: none; stroke: #24D6D9; stroke-width: 4; marker-end: url(#arrow-teal); }
      .governed-out { fill: none; stroke: #60A5FA; stroke-width: 4; marker-end: url(#arrow-blue); }
      .approval-edge { fill: none; stroke: #FFB547; stroke-width: 3; stroke-dasharray: 7 5; marker-end: url(#arrow-amber); }
      .bypass-edge { fill: none; stroke: #FFB547; stroke-width: 3; stroke-dasharray: 9 6; marker-end: url(#arrow-amber); }
      .label-mask { fill: #071521; }
    </style>
  </defs>

  <rect width="640" height="540" fill="#071521"/>

  <rect x="70" y="115" width="500" height="330" rx="18" fill="#0D2947" stroke="#24D6D9" stroke-width="3"/>
  <rect x="193" y="117" width="254" height="34" rx="8" fill="#0D2947"/>
  <text x="320" y="141" class="group-label" text-anchor="middle">Kaimahi governance plane</text>

  <!-- Direct, explicitly ungoverned bypasses stay outside the governance plane. -->
  <path class="bypass-edge" d="M210 68H34V497H85"/>
  <path class="bypass-edge" d="M430 68H606V497H555"/>
  <text x="104" y="29" class="bypass-label" text-anchor="middle">
    <tspan x="104">plain model preset</tspan>
    <tspan x="104" dy="23">ungoverned</tspan>
  </text>
  <text x="536" y="29" class="bypass-label" text-anchor="middle">
    <tspan x="536">direct MCP wiring</tspan>
    <tspan x="536" dy="23">ungoverned</tspan>
  </text>

  <!-- Governed paths enter the plane around the approvals node. -->
  <path class="governed-in" d="M265 92V108H145V285"/>
  <path class="governed-in" d="M375 92V108H495V285"/>
  <path class="governed-out" d="M197.5 410V470"/>
  <path class="governed-out" d="M442.5 410V470"/>

  <!-- Approval branches end at node bounds and never cross node text. -->
  <path class="approval-edge" d="M260 225V240H197.5V285"/>
  <path class="approval-edge" d="M380 225V240H442.5V285"/>

  <rect x="210" y="22" width="220" height="70" rx="13" class="node" fill="#F7F4E8" stroke="#24D6D9"/>
  <text x="320" y="51" class="agent-label" text-anchor="middle">Kubernetes-hosted</text>
  <text x="320" y="77" class="agent-label" text-anchor="middle">agent</text>

  <rect x="205" y="165" width="230" height="60" rx="11" class="node" fill="#FFF1B3" stroke="#FFB547"/>
  <text x="320" y="190" class="node-title" text-anchor="middle">Bounded approvals</text>
  <text x="320" y="214" class="node-detail" text-anchor="middle">expiry and/or use count</text>

  <rect x="85" y="285" width="225" height="125" rx="12" class="node" fill="#F7F4E8" stroke="#60A5FA"/>
  <text x="197.5" y="315" class="node-title" text-anchor="middle">LLM proxy</text>
  <text x="197.5" y="342" class="node-detail" text-anchor="middle">auth · budgets</text>
  <text x="197.5" y="365" class="node-detail" text-anchor="middle">credential custody</text>
  <text x="197.5" y="388" class="node-detail" text-anchor="middle">spend ledger</text>

  <rect x="330" y="285" width="225" height="125" rx="12" class="node" fill="#F7F4E8" stroke="#60A5FA"/>
  <text x="442.5" y="315" class="node-title" text-anchor="middle">MCP gateway</text>
  <text x="442.5" y="342" class="node-detail" text-anchor="middle">tool allowlists</text>
  <text x="442.5" y="365" class="node-detail" text-anchor="middle">upstream bounds</text>
  <text x="442.5" y="388" class="node-detail" text-anchor="middle">audit</text>

  <rect x="85" y="470" width="225" height="55" rx="12" class="node" fill="#F7F4E8" stroke="#60A5FA"/>
  <text x="197.5" y="506" class="node-title" text-anchor="middle">Model provider</text>

  <rect x="330" y="470" width="225" height="55" rx="12" class="node" fill="#F7F4E8" stroke="#60A5FA"/>
  <text x="442.5" y="506" class="node-title" text-anchor="middle">MCP tool server</text>

  <!-- Opaque canvas-colored masks keep every connector label direct and crisp. -->
  <rect x="80" y="168" width="120" height="51" rx="6" class="label-mask"/>
  <text x="140" y="188" class="edge-label" text-anchor="middle">
    <tspan x="140">governed</tspan>
    <tspan x="140" dy="23">model call</tspan>
  </text>
  <rect x="440" y="168" width="120" height="51" rx="6" class="label-mask"/>
  <text x="500" y="188" class="edge-label" text-anchor="middle">
    <tspan x="500">governed</tspan>
    <tspan x="500" dy="23">tool call</tspan>
  </text>

  <rect x="93" y="231" width="174" height="29" rx="6" class="label-mask"/>
  <text x="180" y="252" class="approval-label" text-anchor="middle">temporary grant</text>
  <rect x="373" y="231" width="174" height="29" rx="6" class="label-mask"/>
  <text x="460" y="252" class="approval-label" text-anchor="middle">temporary grant</text>

  <rect x="126.5" y="426" width="142" height="29" rx="6" class="label-mask"/>
  <text x="197.5" y="447" class="edge-label" text-anchor="middle">model relay</text>
  <rect x="380.5" y="426" width="124" height="29" rx="6" class="label-mask"/>
  <text x="442.5" y="447" class="edge-label" text-anchor="middle">tool relay</text>
</svg>
