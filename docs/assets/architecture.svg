<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 570" role="img" aria-labelledby="title desc">
  <title id="title">Kaimahi governance architecture</title>
  <desc id="desc">A Kubernetes-hosted agent sends governed model calls through the Kaimahi LLM proxy and governed tool calls through its MCP gateway. Bounded approvals can temporarily grant either path. Dashed paths show that a plain model preset and direct MCP wiring are ungoverned.</desc>
  <defs>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0D3266"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536878"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D67A08"/></marker>
    <style>
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #071521; }
      .agent-label { font: 700 20px Arial, Helvetica, sans-serif; fill: #FFF1B3; }
      .label { font: 600 17px Arial, Helvetica, sans-serif; fill: #071521; }
      .detail { font: 15px Arial, Helvetica, sans-serif; fill: #071521; }
      .edge-label { font: 600 17px Arial, Helvetica, sans-serif; fill: #0D3266; }
      .bypass-label { font: 600 17px Arial, Helvetica, sans-serif; fill: #536878; }
      .group-label { font: 700 20px Arial, Helvetica, sans-serif; fill: #0D3266; }
      .node { stroke-width: 2; }
    </style>
  </defs>

  <rect x="236" y="82" width="270" height="402" rx="18" fill="#E8F7FA" stroke="#0D3266" stroke-width="2"/>
  <rect x="256" y="69" width="230" height="29" rx="8" fill="#E8F7FA"/>
  <text x="371" y="90" class="group-label" text-anchor="middle">Kaimahi governance plane</text>

  <rect x="32" y="239" width="160" height="78" rx="13" class="node" fill="#071521" stroke="#20D6E8"/>
  <text x="112" y="270" class="agent-label" text-anchor="middle">Kubernetes-</text>
  <text x="112" y="294" class="agent-label" text-anchor="middle">hosted agent</text>

  <rect x="265" y="115" width="210" height="66" rx="11" class="node" fill="#FFF1B3" stroke="#D67A08"/>
  <text x="370" y="143" class="label" text-anchor="middle">Bounded approvals</text>
  <text x="370" y="165" class="detail" text-anchor="middle">expiry and/or use count</text>

  <rect x="265" y="235" width="210" height="84" rx="11" class="node" fill="#F7FBFC" stroke="#0D3266"/>
  <text x="370" y="265" class="title" text-anchor="middle">LLM proxy</text>
  <text x="370" y="289" class="detail" text-anchor="middle">auth · budgets · credential</text>
  <text x="370" y="309" class="detail" text-anchor="middle">custody · spend ledger</text>

  <rect x="265" y="365" width="210" height="84" rx="11" class="node" fill="#F7FBFC" stroke="#0D3266"/>
  <text x="370" y="395" class="title" text-anchor="middle">MCP gateway</text>
  <text x="370" y="419" class="detail" text-anchor="middle">tool allowlists · upstream</text>
  <text x="370" y="439" class="detail" text-anchor="middle">bounds · audit</text>

  <rect x="550" y="238" width="155" height="78" rx="13" class="node" fill="#FFFFFF" stroke="#124E96"/>
  <text x="627" y="270" class="title" text-anchor="middle">Model</text>
  <text x="627" y="295" class="title" text-anchor="middle">provider</text>

  <rect x="550" y="368" width="155" height="78" rx="13" class="node" fill="#FFFFFF" stroke="#124E96"/>
  <text x="627" y="400" class="title" text-anchor="middle">MCP tool</text>
  <text x="627" y="425" class="title" text-anchor="middle">server</text>

  <path d="M 192 264 H 265" fill="none" stroke="#0D3266" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <rect x="203" y="208" width="144" height="25" rx="5" fill="#FFFFFF"/>
  <text x="275" y="227" class="edge-label" text-anchor="middle">governed model call</text>

  <path d="M 192 301 C 222 301, 222 407, 265 407" fill="none" stroke="#0D3266" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <rect x="191" y="336" width="112" height="43" rx="5" fill="#FFFFFF"/>
  <text x="247" y="354" class="edge-label" text-anchor="middle">governed</text>
  <text x="247" y="374" class="edge-label" text-anchor="middle">tool call</text>

  <path d="M 475 277 H 550" fill="none" stroke="#0D3266" stroke-width="3" marker-end="url(#arrow-navy)"/>
  <path d="M 475 407 H 550" fill="none" stroke="#0D3266" stroke-width="3" marker-end="url(#arrow-navy)"/>

  <path d="M 370 181 V 235" fill="none" stroke="#D67A08" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <path d="M 370 181 V 365" fill="none" stroke="#D67A08" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <rect x="377" y="193" width="107" height="24" rx="5" fill="#E8F7FA"/>
  <text x="430" y="211" class="detail" text-anchor="middle" fill="#8A4D05">temporary grant</text>
  <rect x="377" y="331" width="107" height="24" rx="5" fill="#E8F7FA"/>
  <text x="430" y="349" class="detail" text-anchor="middle" fill="#8A4D05">temporary grant</text>

  <path d="M 91 239 C 112 0, 509 0, 550 252" fill="none" stroke="#536878" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-slate)"/>
  <rect x="291" y="15" width="150" height="44" rx="6" fill="#FFFFFF"/>
  <text x="366" y="33" class="bypass-label" text-anchor="middle">plain model preset</text>
  <text x="366" y="53" class="bypass-label" text-anchor="middle">ungoverned</text>

  <path d="M 148 317 C 197 546, 508 546, 550 432" fill="none" stroke="#536878" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-slate)"/>
  <rect x="302" y="514" width="129" height="44" rx="6" fill="#FFFFFF"/>
  <text x="366" y="532" class="bypass-label" text-anchor="middle">direct MCP wiring</text>
  <text x="366" y="552" class="bypass-label" text-anchor="middle">ungoverned</text>
</svg>
