name: lab

# TEMPORARY (W25): one measurement job, deleted before this PR is ready.
#
# The question: the bring-up is ~190s and every shard pays it. Most of it is
# ~2GB of image pulls that are IDENTICAL in every shard. If those bytes were
# already on the node, how long would `make up` take? That number decides
# whether an image cache (restore on the runner, `kind load` into the node)
# is worth building, and it is measured here rather than guessed:
#
#   1. a cold `make up`, and the list of images the cluster actually ran
#   2. `docker pull` those images onto the runner (what a cache would replace)
#   3. a fresh cluster, `kind load` each image into it  (the cost the cache adds)
#   4. `make up` again — the WARM bring-up (the number we are after)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  warm-bringup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install kind
        run: |
          curl -sSfLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build kmx
        run: make bin/kmx
      - name: Cold bring-up, and the images it ran
        run: |
          start=$(date +%s)
          make up
          echo "MEASURE cold-bringup $(( $(date +%s) - start ))s"
          kubectl --context kind-kaimahi-p1 get pods -A \
            -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{range .spec.initContainers[*]}{.image}{"\n"}{end}{end}' \
            | sort -u | grep -v '^$' > images.txt
          cat images.txt
          echo "MEASURE image-count $(wc -l < images.txt)"
      - name: Pull those images onto the runner (this is what a cache would replace)
        run: |
          start=$(date +%s)
          while IFS= read -r img; do
            docker pull -q "$img" || echo "PULL FAILED $img"
          done < images.txt
          echo "MEASURE host-pull $(( $(date +%s) - start ))s"
          # How big is the blob a cache would have to move?
          start=$(date +%s)
          # shellcheck disable=SC2046 # deliberate word splitting: one save, all images
          docker save -o images.tar $(tr '\n' ' ' < images.txt)
          echo "MEASURE docker-save $(( $(date +%s) - start ))s"
          ls -lh images.tar
          start=$(date +%s)
          gzip -1 -c images.tar | wc -c
          echo "MEASURE gzip-time $(( $(date +%s) - start ))s"
      - name: Fresh cluster, side-load every image, then bring up again
        run: |
          make down
          start=$(date +%s)
          kind create cluster --name kaimahi-p1
          echo "MEASURE kind-create $(( $(date +%s) - start ))s"
          start=$(date +%s)
          kind load image-archive images.tar --name kaimahi-p1
          echo "MEASURE kind-load-archive $(( $(date +%s) - start ))s"
          start=$(date +%s)
          make up
          echo "MEASURE warm-bringup $(( $(date +%s) - start ))s"
      - name: The warm cluster still works
        run: |
          make chat | tee chat.out
          python3 scripts/verify-chat.py chat.out
